name: Create Microservice from Template

on:
  workflow_dispatch:
    inputs:
      service_name:
        description: 'Nombre del microservicio (ej: msa-product)'
        required: true
        type: string
      package_name:
        description: 'Nombre del paquete base (ej: product)'
        required: true
        type: string
      description:
        description: 'Descripción del microservicio'
        required: true
        type: string
      contactOpenApi:
        description: 'Contenido del contrato'
        required: true
        type: string
      isClientWeb:
        description: 'Si tiene contrato cliente'
        required: true
        type: string
      contentClient:
        description: 'contenido del contrato'
        required: true
        type: string

jobs:
  generate-microservice:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: Checkout template repo
        uses: actions/checkout@v4
        with:
          repository: hugomauricio/arquetipo-java-spring-boot
          token: ${{ secrets.GH_TOKEN }}
          path: template

      - name: Install Cookiecutter
        run: pip install cookiecutter

      - name: Generate microservice from template
        run: |
          cookiecutter template --no-input \
            service_name='${{ github.event.inputs.service_name }}' \
            package_name='${{ github.event.inputs.package_name }}' \
            description='${{ github.event.inputs.description }}' \
            contactOpenApi='${{ github.event.inputs.contactOpenApi }}' \
            isClientWeb='${{ github.event.inputs.isClientWeb }}' \
            contentClient='${{ github.event.inputs.contentClient }}'

      - name: Create new repository via GitHub API
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO_NAME: ${{ github.event.inputs.service_name }}
          REPO_DESC: ${{ github.event.inputs.description }}
        run: |
          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/user/repos \
            -d "{\"name\":\"$REPO_NAME\",\"private\":true,\"description\":\"$REPO_DESC\"}"

      - name: Push generated code to new repo
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO_NAME: ${{ github.event.inputs.service_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          cd "$REPO_NAME"
          git init
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add .
          git commit -m "Initial commit from template"
          git branch -M main
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/${REPO_NAME}.git"
          git push -u origin main
