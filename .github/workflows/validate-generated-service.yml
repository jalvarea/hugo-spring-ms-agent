name: Validate Generated Service

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Generate OpenAPI sources
        run: mvn clean generate-sources

      - name: Compile
        run: mvn -DskipTests compile

      - name: Run tests
        run: mvn test

      - name: Package
        run: mvn -DskipTests package