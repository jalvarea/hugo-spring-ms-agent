name: Validate Generated Service

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build
        run: mvn clean install

      - name: Check forbidden DTOs
        run: |
          ! grep -R "RequestDto\|ResponseDto" src/main/java || exit 1

      - name: Check forbidden generated package
        run: |
          ! grep -R "com.test.services.rest.server" src/main/java || exit 1