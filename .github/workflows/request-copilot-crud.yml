name: Request Copilot CRUD Implementation

on:
  workflow_dispatch:
    inputs:
      resource_hint:
        description: 'Nombre opcional del recurso, ejemplo Customer'
        required: false
        type: string

permissions:
  contents: read
  issues: write

jobs:
  create-and-assign:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
      OWNER: ${{ github.repository_owner }}
      REPO: ${{ github.event.repository.name }}
      RESOURCE_HINT: ${{ inputs.resource_hint }}

    steps:
      - name: Validate token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "ERROR: GH_TOKEN está vacío. Revisa el secret COPILOT_AGENT_TOKEN."
            exit 1
          fi
          gh auth status

      - name: Create issue
        id: create_issue
        run: |
          BODY=$(cat <<'EOF'
          Implementar el CRUD completo del recurso principal definido en `src/main/resources/openapi.json`.

          Usar estrictamente:
          - `.github/copilot-instructions.md`
          - `.github/instructions/*.instructions.md`
          - `.github/prompts/implement-crud.prompt.md`

          Paquetes OpenAPI:
          - Interfaces API: `com.test.services.server`
          - Modelos request/response: `com.test.services.server.models`

          Reglas obligatorias:
          - No crear DTOs propios como `CustomerRequestDto` o `CustomerResponseDto`.
          - Usar modelos generados por OpenAPI.
          - El controller debe implementar la interfaz generada.
          - No duplicar endpoints con anotaciones manuales.
          - El mapper debe convertir OpenAPI DTO ↔ dominio ↔ entidad.
          - Manejar enums OpenAPI con `getValue()` y `fromValue(...)`.
          - Ejecutar `mvn clean install`.
          EOF
          )

          RESOURCE="${RESOURCE_HINT:-auto}"

          ISSUE_NUMBER=$(gh api "repos/$OWNER/$REPO/issues" \
            --method POST \
            --field title="Implementar CRUD desde OpenAPI - $RESOURCE" \
            --field body="$BODY

          Resource hint: ${RESOURCE_HINT:-derivar desde OpenAPI}" \
            --field labels[]="copilot" \
            --field labels[]="crud" \
            --field labels[]="openapi" \
            --jq '.number')

          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Issue creado: #$ISSUE_NUMBER"

      - name: Get issue node id
        id: issue_node
        run: |
          ISSUE_NUMBER="${{ steps.create_issue.outputs.issue_number }}"

          ISSUE_NODE_ID=$(gh api graphql \
            -f query='
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $number) {
                    id
                  }
                }
              }
            ' \
            -f owner="$OWNER" \
            -f repo="$REPO" \
            -F number="$ISSUE_NUMBER" \
            --jq '.data.repository.issue.id')

          if [ -z "$ISSUE_NODE_ID" ] || [ "$ISSUE_NODE_ID" = "null" ]; then
            echo "ERROR: No se pudo obtener el node id del issue."
            exit 1
          fi

          echo "issue_node_id=$ISSUE_NODE_ID" >> "$GITHUB_OUTPUT"
          echo "Issue node id: $ISSUE_NODE_ID"

      - name: Get repository node id
        id: repo_node
        run: |
          REPO_NODE_ID=$(gh api graphql \
            -f query='
              query($owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) {
                  id
                }
              }
            ' \
            -f owner="$OWNER" \
            -f repo="$REPO" \
            --jq '.data.repository.id')

          if [ -z "$REPO_NODE_ID" ] || [ "$REPO_NODE_ID" = "null" ]; then
            echo "ERROR: No se pudo obtener el node id del repositorio."
            exit 1
          fi

          echo "repo_node_id=$REPO_NODE_ID" >> "$GITHUB_OUTPUT"
          echo "Repository node id: $REPO_NODE_ID"

      - name: Assign issue to Copilot Agent with GraphQL
        run: |
          ISSUE_NODE_ID="${{ steps.issue_node.outputs.issue_node_id }}"
          REPO_NODE_ID="${{ steps.repo_node.outputs.repo_node_id }}"

          gh api graphql \
            -H "GraphQL-Features: issues_copilot_assignment_api_support,coding_agent_model_selection" \
            -f query='
              mutation($issueId: ID!, $targetRepositoryId: ID!, $baseRef: String!) {
                updateIssue(input: {
                  id: $issueId,
                  assigneeIds: ["copilot"],
                  agentAssignment: {
                    targetRepositoryId: $targetRepositoryId,
                    baseRef: $baseRef
                  }
                }) {
                  issue {
                    number
                    title
                    assignees(first: 10) {
                      nodes {
                        login
                      }
                    }
                  }
                }
              }
            ' \
            -f issueId="$ISSUE_NODE_ID" \
            -f targetRepositoryId="$REPO_NODE_ID" \
            -f baseRef="main"

          echo "Issue #${{ steps.create_issue.outputs.issue_number }} asignado a Copilot Agent vía GraphQL"