name: Request Copilot CRUD Implementation

on:
  workflow_dispatch:
    inputs:
      resource_hint:
        description: 'Nombre opcional del recurso, ejemplo Customer'
        required: false
        type: string

permissions:
  contents: read
  issues: write

jobs:
  create-and-assign:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
      OWNER: ${{ github.repository_owner }}
      REPO: ${{ github.event.repository.name }}
      RESOURCE_HINT: ${{ inputs.resource_hint }}

    steps:
      - name: Validate token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "ERROR: GH_TOKEN está vacío. Revisa el secret COPILOT_AGENT_TOKEN."
            exit 1
          fi
          gh auth status

      - name: Create issue
        id: create_issue
        run: |
          BODY=$(cat <<'EOF'
          Implementar el CRUD completo del recurso principal definido en `src/main/resources/openapi.json`.

          Usar estrictamente:
          - `.github/copilot-instructions.md`
          - `.github/instructions/*.instructions.md`
          - `.github/prompts/implement-crud.prompt.md`

          Paquetes OpenAPI:
          - Interfaces API: `com.test.services.server`
          - Modelos request/response: `com.test.services.server.models`

          Reglas obligatorias:
          - No crear DTOs propios como `CustomerRequestDto` o `CustomerResponseDto`.
          - Usar modelos generados por OpenAPI.
          - El controller debe implementar la interfaz generada.
          - No duplicar endpoints con anotaciones manuales.
          - El mapper debe convertir OpenAPI DTO ↔ dominio ↔ entidad.
          - Manejar enums OpenAPI con `getValue()` y `fromValue(...)`.
          - Ejecutar `mvn clean install`.
          EOF
          )

          RESOURCE="${RESOURCE_HINT:-auto}"

          ISSUE_NUMBER=$(gh api "repos/$OWNER/$REPO/issues" \
            --method POST \
            --field title="Implementar CRUD desde OpenAPI - $RESOURCE" \
            --field body="$BODY

          Resource hint: ${RESOURCE_HINT:-derivar desde OpenAPI}" \
            --field labels[]="copilot" \
            --field labels[]="crud" \
            --field labels[]="openapi" \
            --jq '.number')

          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Issue creado: #$ISSUE_NUMBER"

      - name: Assign issue to Copilot Agent
        run: |
          ISSUE_NUMBER="${{ steps.create_issue.outputs.issue_number }}"

          gh api "repos/$OWNER/$REPO/issues/$ISSUE_NUMBER/assignees" \
            --method POST \
            --input - <<EOF
          {
            "assignees": ["copilot"],
            "agent_assignment": {
              "target_repo": "$OWNER/$REPO",
              "base_branch": "main"
            }
          }
          EOF

          echo "Issue #$ISSUE_NUMBER asignado a Copilot Agent"